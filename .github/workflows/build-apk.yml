
name: Build Hakan Music Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          find unpacked -maxdepth 5 -type f | head -80

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Gradle project
        run: |
          find unpacked \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find unpacked \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Gradle project not found in ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakan-Music-Studio-debug-APK
          path: unpacked/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
