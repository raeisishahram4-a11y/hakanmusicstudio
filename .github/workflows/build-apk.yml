name: Build Hakan Music Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked
          echo "Extracted project files:"
          find unpacked -maxdepth 5 -type f | head -80

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find unpacked \( -name settings.gradle -o -name settings.gradle.kts \) -type f -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle settings file not found in ZIP"
            find unpacked -maxdepth 6 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Fix Java and Kotlin targets
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("app/build.gradle.kts"))
          files += list(root.rglob("app/build.gradle"))

          for path in files:
              text = path.read_text()
              text = text.replace("VERSION_1_8", "VERSION_17")
              text = re.sub(
                  r'(jvmTarget\s*=\s*)["\']1\.8["\']',
                  r'\1"17"',
                  text
              )
              text = text.replace("JvmTarget.JVM_1_8", "JvmTarget.JVM_17")
              path.write_text(text)
              print("Checked:", path)
          PY

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakan-Music-Studio-debug-APK
          path: unpacked/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
